name: Client CI/CD

on:
  push:
    branches: [ "main", "master", "dev" ]
    paths:
      - "client/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "client/**"

jobs:
  lint-and-test:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (stub with legacy peer deps)
        # TODO: Clean npm ci after removing vite-tsconfig-paths in favor of Vite 8 native tsconfig resolution
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run build
        run: npm run build

  docker-build:
    name: Docker Build & Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: travel-organizer-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
